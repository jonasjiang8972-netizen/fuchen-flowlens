version: '3.8'

services:
  # ============================================================
  # 基础设施
  # ============================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowlens
      POSTGRES_USER: flowlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../contracts/ddl/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: flowlens
      CLICKHOUSE_USER: flowlens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/.env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ============================================================
  # 平台服务
  # ============================================================
  platform:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      # Accounts, sessions, security policy and the audit trail are stored here.
      # Inside the compose network TLS is off; for an external database use sslmode=verify-full.
      FLOWLENS_DB_DSN: postgres://flowlens:${POSTGRES_PASSWORD}@postgres:5432/flowlens?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      ES_ADDR: http://elasticsearch:9200
      LOG_LEVEL: info
      # Initial password of the bootstrap accounts (sysadmin / auditadmin / secadmin),
      # used only on first start; each must change it at first login. When empty a
      # random password is generated and printed once in the platform log.
      FLOWLENS_ADMIN_PASSWORD: ${FLOWLENS_ADMIN_PASSWORD:-}
      # Trust X-Forwarded-For only from the web container's network (real client IPs
      # in audit records and login rate limits).
      FLOWLENS_TRUSTED_PROXIES: ${FLOWLENS_TRUSTED_PROXIES:-172.16.0.0/12}
      # Set to true when the console is served over HTTPS (Secure session cookie).
      FLOWLENS_COOKIE_SECURE: ${FLOWLENS_COOKIE_SECURE:-false}
      # Shared secret agents send as X-Agent-Token; agent endpoints reject all requests when empty
      FLOWLENS_AGENT_TOKEN: ${FLOWLENS_AGENT_TOKEN:-}
      # Comma-separated origins allowed cross-origin; the bundled web console is same-origin
      FLOWLENS_CORS_ORIGINS: ${FLOWLENS_CORS_ORIGINS:-}
    restart: unless-stopped

  # ============================================================
  # 前端
  # ============================================================
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - platform
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  es_data:
  redis_data:
