# FlowLens agent configuration for the POC compose deployment.
# The auth token comes from FLOWLENS_AGENT_TOKEN in .env.
agent:
  id: poc-agent-01
  cluster: poc
  log_level: info

collector:
  # This version collects from gateway access logs.
  mode: gateway_log
  gateway_log:
    path: /var/log/gateway/access.log
    # json: one JSON object per line (Kong file-log fields, or the flat
    #   fields of the demo generator). Request headers such as x-user-id
    #   identify callers.
    # nginx: text lines written by an nginx log_format (nginx, OpenResty,
    #   Kong and APISIX access logs). Copy the gateway's log_format below;
    #   leave it empty for the standard "combined" format. Add
    #   $request_time, $upstream_addr, $host and $http_x_user_id (any
    #   $http_<header>) to the gateway format for richer analysis.
    format: json
    # nginx_log_format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time "$upstream_addr" $host "$http_x_user_id"'
    # remote_addr (default) or x_forwarded_for when the gateway sits
    # behind a load balancer.
    # client_ip_from: remote_addr

management:
  # Inside the compose network the agent talks to the platform directly.
  # An agent on another host uses the console address instead, e.g.
  # 10.0.0.10:8443 with use_tls: true and tls_ca_path set to the CA (or the
  # self-signed certs/server.crt) of the console certificate.
  platform_endpoint: platform:8080
  use_tls: false
  heartbeat_interval_s: 10s

kafka:
  batch_size: 200
  flush_interval_ms: 1000
